<header class="header">
  <div class="header__left">
    <svg
      class="header__icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <polyline points="4 7 4 4 20 4 20 7" />
      <line x1="9" y1="20" x2="15" y2="20" />
      <line x1="12" y1="4" x2="12" y2="20" />
    </svg>
    <h1 class="header__title">Glyph Forge</h1>
  </div>

  <app-theme-switcher class="header__themes" />

  @if (fontService.isLoaded()) {
    <span class="header__filename">{{ fontService.loadedFont()?.fileName }}</span>
    <button class="header__btn" (click)="fontService.removeFont()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      Upload New
    </button>
  }
</header>

<main class="main">
  <router-outlet />
</main>
